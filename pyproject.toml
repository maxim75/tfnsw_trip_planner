[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tfnsw-trip-planner"
version = "1.5.0"
description = "A clean, idiomatic Python library for the Transport for NSW Trip Planning APIs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Maksym Kozlenko", email = "max@kozlenko.info"}
]
maintainers = [
    {name = "Maksym Kozlenko", email = "max@kozlenko.info"}
]
keywords = [
    "tfnsw",
    "transport-nsw",
    "trip-planner",
    "api-client",
    "transport",
    "australia",
    "nsw",
    "opendata"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32.4",
    # Windows has no system timezone database for zoneinfo.
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
realtime = [
    "gtfs-realtime-bindings>=1.0.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "python-dotenv>=1.0.0",
    "mypy>=1.15",
    "ruff>=0.9",
]

[project.urls]
Homepage = "https://github.com/maxim75/tfnsw_trip_planner"
Documentation = "https://github.com/maxim75/tfnsw_trip_planner#readme"
Repository = "https://github.com/maxim75/tfnsw_trip_planner"
Issues = "https://github.com/maxim75/tfnsw_trip_planner/issues"
API = "https://opendata.transport.nsw.gov.au/"

[tool.setuptools.packages.find]
where = ["."]
include = ["tfnsw_trip_planner*"]

[tool.setuptools.package-data]
tfnsw_trip_planner = ["py.typed"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: live tests that hit the real TfNSW API (require TFNSW_API_KEY)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# The demo notebook is a rendered walkthrough (see build_demo.sh), not library code.
extend-exclude = ["demo.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]